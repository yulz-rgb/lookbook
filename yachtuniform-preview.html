<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>YachtUniform</title>
<style>
:root{--navy:#0b1f3a;--muted:#95a2b3}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eaf1f6;overflow:hidden}
.page{position:relative;width:100vw;height:100vh;display:grid;place-items:center;background-image:linear-gradient(rgba(242,247,251,.10),rgba(238,244,249,.12)),url('https://raw.githubusercontent.com/yulz-rgb/lookbook/main/public/onboarding-yacht.jpg');background-size:cover;background-position:center;color:var(--navy)}
.brand{position:fixed;top:28px;left:32px;font:400 25px Georgia,"Times New Roman",serif;letter-spacing:-.03em;z-index:3}.avatar{position:fixed;top:24px;right:31px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(216,225,235,.82);font-size:12px;font-weight:700;color:#53677f;z-index:3}
.card{position:relative;width:min(760px,calc(100vw - 38px));border:1px solid rgba(255,255,255,.82);border-radius:34px;background:rgba(246,249,252,.72);backdrop-filter:blur(22px) saturate(115%);-webkit-backdrop-filter:blur(22px) saturate(115%);box-shadow:0 25px 80px rgba(14,34,57,.18);padding:52px 54px 48px;text-align:center}
.wave{font:400 40px Georgia,"Times New Roman",serif;opacity:.46;line-height:1;margin-bottom:28px}.title-row{display:flex;align-items:center;justify-content:center;gap:12px}.title{margin:0;font:400 clamp(34px,5.2vw,57px)/1.05 Georgia,"Times New Roman",serif;letter-spacing:.01em}.edit{border:0;background:transparent;color:var(--navy);cursor:pointer;font-size:20px;padding:7px}
.helper{margin:12px 0 0;color:var(--muted);font-size:13px;transition:opacity 1.5s ease}.helper.fade{opacity:0}
.upload{width:100%;min-height:230px;margin-top:42px;border:1px dashed rgba(11,31,58,.20);border-radius:28px;background:rgba(255,255,255,.70);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;color:var(--navy);cursor:pointer;padding:28px}.upload:hover{background:rgba(255,255,255,.80)}
.upload-icon{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:rgba(229,237,246,.92);font-size:37px}.upload-title{font:400 clamp(21px,2.7vw,30px)/1.2 Georgia,"Times New Roman",serif}.types{font-size:12px;letter-spacing:.24em;color:#8391a4}.manual{margin-top:31px;border:0;border-bottom:1px solid rgba(11,31,58,.40);background:transparent;color:var(--navy);font:400 14px Georgia,"Times New Roman",serif;cursor:pointer;padding:2px 0 3px}
.editor{display:none;align-items:center;gap:8px}.editor.open{display:flex}.editor input{flex:1;min-width:0;border:1px solid rgba(11,31,58,.18);border-radius:12px;background:rgba(255,255,255,.84);color:var(--navy);padding:9px 12px;font:400 clamp(25px,4vw,40px) Georgia,"Times New Roman",serif;outline:none}.save,.cancel{border:0;border-radius:10px;padding:11px 14px;cursor:pointer}.save{background:var(--navy);color:white}.cancel{background:rgba(255,255,255,.65);color:var(--navy)}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(8px);background:rgba(11,31,58,.90);color:#fff;border-radius:999px;padding:10px 14px;font-size:12px;opacity:0;transition:.25s ease;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:650px){.brand{top:18px;left:20px;font-size:20px}.avatar{top:15px;right:18px;width:32px;height:32px}.card{padding:42px 20px 36px;border-radius:25px}.upload{min-height:205px;margin-top:36px}.title-row{gap:6px}.edit{font-size:17px}.helper{font-size:11px}}
</style>
</head>
<body>
<div class="page">
  <div class="brand">YachtUniform</div>
  <div class="avatar">CS</div>
  <main class="card">
    <div class="wave">≋</div>
    <div id="displayRow" class="title-row">
      <h1 id="vesselName" class="title">M/Y CONFIDENTIAL</h1>
      <button id="editBtn" class="edit" aria-label="Edit yacht name">✎</button>
    </div>
    <div id="editor" class="editor">
      <input id="nameInput" value="M/Y CONFIDENTIAL" aria-label="Yacht name" />
      <button id="saveBtn" class="save">Save</button>
      <button id="cancelBtn" class="cancel">×</button>
    </div>
    <p id="helper" class="helper">Keep your yacht confidential, or add the name if you prefer.</p>
    <input id="fileInput" type="file" accept=".xlsx,.xls,.csv,.pdf" hidden />
    <button id="upload" class="upload">
      <span class="upload-icon">⇧</span>
      <span class="upload-title">Import current crew, sizes &amp; inventory</span>
      <span class="types">Excel · CSV · PDF</span>
    </button>
    <button id="manual" class="manual">No file? Start manually →</button>
  </main>
  <div id="toast" class="toast"></div>
</div>
<script>
const helper=document.getElementById('helper');setTimeout(()=>helper.classList.add('fade'),5000);
const displayRow=document.getElementById('displayRow'),editor=document.getElementById('editor'),input=document.getElementById('nameInput'),name=document.getElementById('vesselName');
function openEdit(){input.value=name.textContent;displayRow.style.display='none';editor.classList.add('open');input.focus();input.select()}
function closeEdit(save){if(save){name.textContent=(input.value||'').trim()||'M/Y CONFIDENTIAL'}editor.classList.remove('open');displayRow.style.display='flex'}
document.getElementById('editBtn').onclick=openEdit;document.getElementById('saveBtn').onclick=()=>closeEdit(true);document.getElementById('cancelBtn').onclick=()=>closeEdit(false);input.addEventListener('keydown',e=>{if(e.key==='Enter')closeEdit(true);if(e.key==='Escape')closeEdit(false)});
const fileInput=document.getElementById('fileInput'),toast=document.getElementById('toast');document.getElementById('upload').onclick=()=>fileInput.click();
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3200)}
fileInput.onchange=()=>{const f=fileInput.files&&fileInput.files[0];if(f)showToast('Selected: '+f.name)};document.getElementById('manual').onclick=()=>showToast('Manual setup will open here next.');
</script>
</body>
</html>
